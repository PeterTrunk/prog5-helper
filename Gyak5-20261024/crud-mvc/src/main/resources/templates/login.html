<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('Login')}"></header>
<h1 th:text="Login"></h1>
<form th:action="@{/login}" method="post" class="card">
    <label for="username" th:text="'Username'"></label>
    <input type="text" id="username" name="username">

    <label for="password" th:text="'Password'"></label>
    <input type="password" id="password" name="password">
    <br>
    <br>
    <button type="submit" th:text="'Login'"></button>
</form>
</body>
</html>
